<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Selectors in CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. Tag / Element Selector -->
    <h1> Selectors in CSS </h1>
    <p> This is a normal paragraph styled using the tag selector. </p>

    <hr>

    <!-- 2. Class Selector (.) -->
    <h2> Class Selector </h2>
    <p class="highlight"> This paragraph is styled using a class selector (.highlight). </p>
    <p class="highlight"> Another paragraph sharing the same class. </p>

    <hr>

    <!-- 3. ID Selector (#) -->
    <h2> ID Selector </h2>
    <p id="special"> This paragraph is styled uniquely using an ID selector (#special). </p>

    <hr>
</body>
</html>
