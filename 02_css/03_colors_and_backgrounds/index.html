<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Colors &amp; Backgrounds</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> Colors &amp; Backgrounds in CSS </h1>
    <p> Exploring text color, background-color, HEX codes, RGB, and background images. </p>

    <hr>

    <!-- 1. Named Colors & Background Color -->
    <h2 class="named"> Named Colors </h2>
    <p class="named"> Text with white color and darkred background-color. </p>

    <hr>

    <!-- 2. HEX Codes -->
    <h2 class="hex"> HEX Code Color (#38bdf8) </h2>

    <hr>

    <!-- 3. RGB Format -->
    <h2 class="rgb"> RGB Color (rgb(255, 99, 71)) </h2>

    <hr>

    <!-- 4. Background Image / Gradient -->
    <div class="gradient-box">
        <h2> Background Image (Linear Gradient) </h2>
    </div>
</body>
</html>
