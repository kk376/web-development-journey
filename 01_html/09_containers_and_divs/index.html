<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Containers and Divs</title>
</head>
<body>
    <h1> Containers and Div in HTML </h1>
    <p> The div tag is used to create a division or a section in an HTML page. It is a generic container for grouping elements together. Below is an example: </p>
    <div>
        <h2> This is a heading inside a div </h2>
        <p> This is a paragraph inside a div. </p>
    </div>
</body>
</html>
