<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Document</title>
</head>
<body>
    <h1> Links in HTML </h1>
    <p> The a tag is used to create a hyperlink in an HTML page. href attribute specifies the URL of the page the link goes to. Below is an example: </p>
    <a href="https://www.google.com">Visit Google</a>
    <p> The above link will take you to Google. </p>
    <hr>

    <a href="https://www.github.com/kk376">Visit my GitHub</a>
    <p> The above link will take you to my GitHub profile. </p>
    <hr>
</body>
</html>
