<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Forms in HTML</title>
</head>
<body>
    <h1>Forms and Inputs in HTML</h1>
    <p> The form tag is used to create a form in an HTML page. Below is an example: </p>
    <form>
        First Name <input type="text" placeholder="Enter your first name">
        Last Name <input type="text" placeholder="Enter your last name">
        <br><br>
        Gender <br>
        Male <input type="radio">
        Female <input type="radio">
        <br><br>
        Date of Birth <input type="datetime-local">
        <br><br>
        Email <input type="email" placeholder="Enter your email address">
        <br><br>
        Password <input type="password" placeholder="Enter a secure password">
        <br><br>
        Do you agree with terms and conditions? <br>
        Yes <input type="checkbox">
        <hr>
    </form>
</body>
</html>
